<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball A9 open - V9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .app-header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .card { background: white; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
        .input-group { border: 2px solid #e2e8f0; border-radius: 16px; padding: 12px 16px; transition: all 0.2s; outline: none; width: 100%; background: white; }
        .input-group:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .player-chip { display: none; }
        .player-label { display: flex; align-items: center; justify-content: center; padding: 10px; border: 2px solid #f1f5f9; border-radius: 14px; cursor: pointer; transition: all 0.2s; font-weight: 600; font-size: 0.75rem; background: #fff; text-align: center; height: 100%; }
        .player-chip:checked + .player-label { background-color: #eef2ff; border-color: #4f46e5; color: #4f46e5; transform: translateY(-2px); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 200px; overflow-y: auto; padding: 4px; }
        
        /* Highlight Top 3 */
        .rank-1 { background: linear-gradient(to right, #fefce8, #fff); border-left: 4px solid #eab308 !important; }
        .rank-2 { background: linear-gradient(to right, #f8fafc, #fff); border-left: 4px solid #94a3b8 !important; }
        .rank-3 { background: linear-gradient(to right, #fff7ed, #fff); border-left: 4px solid #9a3412 !important; }
        .medal { font-size: 1.2rem; margin-right: 4px; }
    </style>
</head>
<body class="min-h-screen">

    <header class="app-header text-white pt-6 pb-20 px-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter uppercase">Pickleball <span class="text-indigo-200">A9 Open</span></h1>
            <button id="auth-btn" onclick="showTab('tab-admin')" class="bg-white/20 hover:bg-white/30 backdrop-blur-md px-4 py-2 rounded-full text-xs font-bold transition">ĐĂNG NHẬP</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 -mt-12 pb-24">
        <nav class="card mb-6 overflow-hidden">
            <div class="flex justify-between items-center px-2">
                <button onclick="showTab('tab-sessions')" id="btn-tab-sessions" class="flex-1 py-4 flex flex-col items-center gap-1 transition tab-active">
                    <span class="text-xl">📅</span><span class="text-[10px] font-bold uppercase tracking-widest">Buổi</span>
                </button>
                <button onclick="showTab('tab-matches')" id="btn-tab-matches" class="flex-1 py-4 flex flex-col items-center gap-1 transition text-slate-400">
                    <span class="text-xl">🎾</span><span class="text-[10px] font-bold uppercase tracking-widest">Trận</span>
                </button>
                <button onclick="showTab('tab-players')" id="btn-tab-players" class="flex-1 py-4 flex flex-col items-center gap-1 transition text-slate-400">
                    <span class="text-xl">👥</span><span class="text-[10px] font-bold uppercase tracking-widest">Thành viên</span>
                </button>
                <button onclick="showTab('tab-stats')" id="btn-tab-stats" class="flex-1 py-4 flex flex-col items-center gap-1 transition text-slate-400">
                    <span class="text-xl">📊</span><span class="text-[10px] font-bold uppercase tracking-widest">Thống kê</span>
                </button>
                <button onclick="showTab('tab-fund')" id="btn-tab-fund" class="flex-1 py-4 flex flex-col items-center gap-1 transition text-slate-400">
                    <span class="text-xl">💰</span><span class="text-[10px] font-bold uppercase tracking-widest">Quỹ</span>
                </button>
            </div>
        </nav>

        <div id="date-filter-box" class="hidden card p-4 mb-6 space-y-3 border-2 border-indigo-100">
            <div class="flex justify-between items-center">
                <h3 class="text-[11px] font-black text-indigo-600 uppercase tracking-wider">Bộ lọc thời gian</h3>
                <button onclick="clearDateFilter()" class="text-[10px] text-slate-400 font-bold uppercase">Tất cả thời gian</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="filter-from-date" class="input-group text-xs !p-2" onchange="handleDateFilterChange('from')">
                <input type="date" id="filter-to-date" class="input-group text-xs !p-2" onchange="handleDateFilterChange('to')">
            </div>
        </div>

        <section id="tab-sessions" class="panel space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest">Lịch sử buổi</h2>
                <button onclick="openSessionModal()" id="admin-add-session" class="hidden bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">+ Buổi mới</button>
            </div>
            <div id="sessions-list" class="space-y-4"></div>
        </section>

        <section id="tab-matches" class="panel hidden space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest">Danh sách trận</h2>
                <button onclick="openMatchModal()" id="admin-add-match" class="hidden bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">+ Trận mới</button>
            </div>
            <div id="matches-list" class="space-y-4"></div>
        </section>

        <section id="tab-players" class="panel hidden space-y-4">
            <div class="card p-6 space-y-4">
                <h2 class="text-sm font-black text-slate-400 uppercase">Thành viên nhóm</h2>
                <div id="admin-player-input" class="hidden">
                    <div class="flex gap-2">
                        <input type="text" id="new-p-name" class="input-group" placeholder="Tên...">
                        <button onclick="addMember()" class="bg-indigo-600 text-white px-6 rounded-xl font-bold">+</button>
                    </div>
                </div>
                <div id="player-list-ui" class="space-y-2"></div>
            </div>
        </section>

        <section id="tab-stats" class="panel hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="card p-4 text-center">
                    <div class="text-[10px] font-black text-slate-400 uppercase">Tổng số buổi</div>
                    <div id="stat-total-sessions" class="text-2xl font-black text-indigo-600">0</div>
                </div>
                <div class="card p-4 text-center">
                    <div class="text-[10px] font-black text-slate-400 uppercase">Tổng số trận</div>
                    <div id="stat-total-matches" class="text-2xl font-black text-purple-600">0</div>
                </div>
            </div>

            <div class="card p-5 overflow-hidden">
                <h3 class="text-[11px] font-black text-slate-400 uppercase mb-4 tracking-widest">Bảng xếp hạng hiệu suất</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="text-slate-400 uppercase font-black border-b text-[10px]">
                                <th class="pb-2">Thành viên</th>
                                <th class="pb-2 text-center">Thắng</th>
                                <th class="pb-2 text-center">Thua</th>
                                <th class="pb-2 text-right">% Thắng</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-fund" class="panel hidden space-y-4">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest px-2">Quyết toán phí</h2>
            <div id="fund-list" class="space-y-3"></div>
        </section>

        <section id="tab-admin" class="panel hidden">
            <div id="login-box" class="card p-8 text-center space-y-6">
                <!-- <h2 class="text-xl font-black uppercase tracking-widest">Login</h2> -->
                <div class="space-y-3">
                    <input type="text" id="user" placeholder="Username" class="input-group text-center">
                    <input type="password" id="pass" placeholder="Password" class="input-group text-center">
                </div>
                <button onclick="doLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">VÀO QUẢN TRỊ</button>
            </div>
            <div id="admin-panel" class="hidden card p-6 text-center space-y-4">
                <div class="text-green-500 text-3xl">🛡️</div>
                <h3 class="font-bold">Đã kích hoạt quyền Admin</h3>
                <button onclick="doLogout()" class="text-red-500 font-bold text-xs uppercase">Thoát quản trị</button>
            </div>
        </section>
    </main>

    <div id="session-modal" class="modal">
        <div class="card w-full max-w-lg p-6 space-y-5">
            <input type="hidden" id="edit-session-id">
            <h3 id="session-modal-title" class="font-black uppercase text-sm">Cập nhật buổi</h3>
            <div class="space-y-4">
                <input type="date" id="sDate" class="input-group text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="sCourtFee" class="input-group text-sm" placeholder="Sân (k)">
                    <input type="number" id="sWaterFee" class="input-group text-sm" placeholder="Nước (k)">
                </div>
                <div id="session-players-select" class="checkbox-grid"></div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeSessionModal()" class="flex-1 bg-slate-100 py-4 rounded-2xl font-bold text-xs">HỦY</button>
                <button onclick="saveSession()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold text-xs">LƯU BUỔI</button>
            </div>
        </div>
    </div>

    <div id="match-modal" class="modal">
        <div class="card w-full max-w-lg p-6 space-y-5 overflow-y-auto max-h-[90vh]">
            <input type="hidden" id="edit-match-id">
            <div class="flex justify-between items-center">
                <h3 id="match-modal-title" class="font-black uppercase text-sm">Ghi nhận trận</h3>
                <button onclick="closeMatchModal()" class="text-slate-400 font-bold">✖</button>
            </div>
            <select id="mSessionId" class="input-group text-sm font-bold" onchange="renderMatchPlayerSelection()"></select>
            <input type="number" id="mBet" placeholder="Cược (k)" class="input-group text-sm">
            <div class="grid grid-cols-2 gap-4">
                <div id="tA-select" class="space-y-2"></div>
                <div id="tB-select" class="space-y-2"></div>
            </div>
            <select id="mWin" class="input-group text-sm font-bold">
                <option value="A">TEAM A THẮNG</option>
                <option value="B">TEAM B THẮNG</option>
            </select>
            <button onclick="saveMatch()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm">LƯU TRẬN</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('pb_v8_players')) || [{id:1, name:'Hải Đăng'}, {id:2, name:'Minh Tú'}];
        let matches = JSON.parse(localStorage.getItem('pb_v8_matches')) || [];
        let sessions = JSON.parse(localStorage.getItem('pb_v8_sessions')) || [];
        let isAdmin = localStorage.getItem('pb_v8_auth') === 'true';

        function showTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('tab-active'); b.classList.add('text-slate-400');
            });
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('tab-active');

            document.getElementById('date-filter-box').classList.toggle('hidden', !(id === 'tab-stats' || id === 'tab-fund'));
            render();
        }

        function handleDateFilterChange(type) {
            const from = document.getElementById('filter-from-date').value;
            const to = document.getElementById('filter-to-date').value;
            if(type === 'from' && from && !to) document.getElementById('filter-to-date').value = from;
            render();
        }

        function clearDateFilter() {
            document.getElementById('filter-from-date').value = '';
            document.getElementById('filter-to-date').value = '';
            render();
        }

        function isSessionInFilter(date) {
            const from = document.getElementById('filter-from-date').value;
            const to = document.getElementById('filter-to-date').value;
            if(from && date < from) return false;
            if(to && date > to) return false;
            return true;
        }

        // --- Session functions ---
        function openSessionModal(id = null) {
            if(!isAdmin) return;
            document.getElementById('edit-session-id').value = id || '';
            const container = document.getElementById('session-players-select');
            container.innerHTML = players.map(p => `
                <div>
                    <input type="checkbox" id="ps-${p.id}" class="player-chip s-attendee-cb" value="${p.name}">
                    <label for="ps-${p.id}" class="player-label">${p.name}</label>
                </div>
            `).join('');
            if(id) {
                const s = sessions.find(x => x.id == id);
                document.getElementById('sDate').value = s.date;
                document.getElementById('sCourtFee').value = s.courtFee / 1000;
                document.getElementById('sWaterFee').value = s.waterFee / 1000;
                document.querySelectorAll('.s-attendee-cb').forEach(cb => { if(s.attendees.includes(cb.value)) cb.checked = true; });
            } else {
                document.getElementById('sDate').valueAsDate = new Date();
                document.getElementById('sCourtFee').value = ''; document.getElementById('sWaterFee').value = '';
            }
            document.getElementById('session-modal').classList.add('active');
        }

        function saveSession() {
            const id = document.getElementById('edit-session-id').value;
            const date = document.getElementById('sDate').value;
            const attendees = Array.from(document.querySelectorAll('.s-attendee-cb:checked')).map(cb => cb.value);
            if(!date || attendees.length === 0) return alert('Thiếu thông tin!');
            
            const data = {
                id: id ? parseInt(id) : Date.now(),
                date, attendees, playerCount: attendees.length,
                courtFee: (document.getElementById('sCourtFee').value || 0) * 1000,
                waterFee: (document.getElementById('sWaterFee').value || 0) * 1000
            };
            if(id) sessions[sessions.findIndex(x => x.id == id)] = data;
            else sessions.unshift(data);
            localStorage.setItem('pb_v8_sessions', JSON.stringify(sessions));
            closeSessionModal(); render();
        }

        function closeSessionModal() { document.getElementById('session-modal').classList.remove('active'); }

        // --- Match functions ---
        function openMatchModal(id = null) {
            if(!isAdmin || sessions.length === 0) return alert('Cần tạo buổi chơi trước!');
            document.getElementById('edit-match-id').value = id || '';
            const sSelect = document.getElementById('mSessionId');
            sSelect.innerHTML = sessions.map(s => `<option value="${s.id}">${s.date}</option>`).join('');
            if(id) {
                const m = matches.find(x => x.id == id);
                sSelect.value = m.sessionId;
                document.getElementById('mBet').value = m.bet / 1000;
                document.getElementById('mWin').value = m.win;
                renderMatchPlayerSelection(m.tA, m.tB);
            } else {
                document.getElementById('mBet').value = ''; renderMatchPlayerSelection();
            }
            document.getElementById('match-modal').classList.add('active');
        }

        function renderMatchPlayerSelection(selA = [], selB = []) {
            const s = sessions.find(x => x.id == document.getElementById('mSessionId').value);
            const makeHtml = (name, team) => `<div>
                <input type="checkbox" id="m${team}-${name}" class="player-chip ${team}-cb" value="${name}" ${(team==='A'?selA:selB).includes(name)?'checked':''} onchange="handleMatchToggle()">
                <label for="m${team}-${name}" class="player-label">${name}</label>
            </div>`;
            document.getElementById('tA-select').innerHTML = s.attendees.map(n => makeHtml(n, 'A')).join('');
            document.getElementById('tB-select').innerHTML = s.attendees.map(n => makeHtml(n, 'B')).join('');
            handleMatchToggle();
        }

        function handleMatchToggle() {
            const tA = Array.from(document.querySelectorAll('.A-cb:checked')).map(c => c.value);
            const tB = Array.from(document.querySelectorAll('.B-cb:checked')).map(c => c.value);
            document.querySelectorAll('.B-cb').forEach(cb => cb.disabled = tA.includes(cb.value));
            document.querySelectorAll('.A-cb').forEach(cb => cb.disabled = tB.includes(cb.value));
        }

        function saveMatch() {
            const id = document.getElementById('edit-match-id').value;
            const tA = Array.from(document.querySelectorAll('.A-cb:checked')).map(c => c.value);
            const tB = Array.from(document.querySelectorAll('.B-cb:checked')).map(c => c.value);
            if(!tA.length || !tB.length) return alert('Chọn người chơi!');
            const data = {
                id: id ? parseInt(id) : Date.now(),
                sessionId: document.getElementById('mSessionId').value,
                bet: (document.getElementById('mBet').value || 0) * 1000,
                tA, tB, win: document.getElementById('mWin').value
            };
            if(id) matches[matches.findIndex(x => x.id == id)] = data;
            else matches.unshift(data);
            localStorage.setItem('pb_v8_matches', JSON.stringify(matches));
            closeMatchModal(); render();
        }

        function closeMatchModal() { document.getElementById('match-modal').classList.remove('active'); }

        // --- Admin & Member ---
        function doLogin() {
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === '123') {
                isAdmin = true; localStorage.setItem('pb_v8_auth', 'true'); showTab('tab-sessions');
            } else alert('Sai!');
        }
        function doLogout() { isAdmin = false; localStorage.setItem('pb_v8_auth', 'false'); render(); }
        function addMember() {
            const n = document.getElementById('new-p-name').value.trim();
            if(n) { players.push({id:Date.now(), name:n}); localStorage.setItem('pb_v8_players', JSON.stringify(players)); render(); }
            document.getElementById('new-p-name').value = '';
        }

        // --- Core Rendering ---
        function render() {
            document.getElementById('auth-btn').innerText = isAdmin ? 'ADMIN' : 'ĐĂNG NHẬP';
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-player-input').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-add-session').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-add-match').classList.toggle('hidden', !isAdmin);

            // Tab Buổi
            document.getElementById('sessions-list').innerHTML = sessions.map(s => `
                <div class="card p-4 space-y-2">
                    <div class="flex justify-between font-black text-[10px] text-indigo-600 uppercase">
                        <span>${s.date}</span><span>${s.playerCount} người</span>
                    </div>
                    <div class="text-[10px] text-slate-400 italic">${s.attendees.join(', ')}</div>
                    <div class="flex justify-between font-bold text-xs">
                        <span>Sân+Nước: ${(s.courtFee+s.waterFee).toLocaleString()}đ</span>
                        <span class="text-red-500">Mỗi người: ${Math.round((s.courtFee+s.waterFee)/s.playerCount).toLocaleString()}đ</span>
                    </div>
                    ${isAdmin ? `<div class="pt-2 flex gap-4"><button onclick="openSessionModal(${s.id})" class="text-indigo-500 text-[10px] font-bold">SỬA</button><button onclick="sessions=sessions.filter(x=>x.id!=${s.id});localStorage.setItem('pb_v8_sessions',JSON.stringify(sessions));render();" class="text-red-400 text-[10px] font-bold">XÓA</button></div>` : ''}
                </div>
            `).join('');

            // Tab Trận
            document.getElementById('matches-list').innerHTML = matches.map(m => {
                const s = sessions.find(x => x.id == m.sessionId) || {date:''};
                return `<div class="card p-4 border-l-4 ${m.win==='A'?'border-indigo-500':'border-purple-500'}">
                    <div class="flex justify-between text-[9px] font-black text-slate-400 mb-1"><span>${s.date}</span><span class="${m.win==='A'?'text-indigo-600':'text-purple-600'}">TEAM ${m.win} THẮNG</span></div>
                    <div class="text-xs font-bold flex justify-between">
                        <div><div class="${m.win==='A'?'text-indigo-600':'text-slate-400'}">A: ${m.tA.join(', ')}</div><div class="${m.win==='B'?'text-purple-600':'text-slate-400'}">B: ${m.tB.join(', ')}</div></div>
                        <div class="font-black text-indigo-600">${m.bet.toLocaleString()}đ</div>
                    </div>
                    ${isAdmin ? `<div class="pt-2 flex gap-4"><button onclick="openMatchModal(${m.id})" class="text-indigo-500 text-[10px] font-bold">SỬA</button><button onclick="matches=matches.filter(x=>x.id!=${m.id});localStorage.setItem('pb_v8_matches',JSON.stringify(matches));render();" class="text-red-400 text-[10px] font-bold">XÓA</button></div>` : ''}
                </div>`;
            }).join('');

            // Tính toán thống kê & lọc
            const stats = {};
            players.forEach(p => stats[p.name] = { w:0, l:0, sessionFee:0, winMoney:0 });
            
            let totalSessions = 0;
            let totalMatches = 0;

            sessions.forEach(s => {
                if(!isSessionInFilter(s.date)) return;
                totalSessions++;
                const per = (s.courtFee+s.waterFee)/s.playerCount;
                s.attendees.forEach(n => { if(stats[n]) stats[n].sessionFee += per; });
            });

            matches.forEach(m => {
                const s = sessions.find(x => x.id == m.sessionId);
                if(!s || !isSessionInFilter(s.date)) return;
                totalMatches++;
                if(m.win==='A'){
                    m.tA.forEach(n => { if(stats[n]){ stats[n].w++; stats[n].winMoney += (m.bet/m.tA.length); } });
                    m.tB.forEach(n => { if(stats[n]){ stats[n].l++; stats[n].winMoney -= (m.bet/m.tB.length); } });
                } else {
                    m.tB.forEach(n => { if(stats[n]){ stats[n].w++; stats[n].winMoney += (m.bet/m.tB.length); } });
                    m.tA.forEach(n => { if(stats[n]){ stats[n].l++; stats[n].winMoney -= (m.bet/m.tA.length); } });
                }
            });

            document.getElementById('stat-total-sessions').innerText = totalSessions;
            document.getElementById('stat-total-matches').innerText = totalMatches;

            // Render Stats Table với Rank
            const sorted = Object.keys(stats).map(n => ({
                name: n, w: stats[n].w, l: stats[n].l, m: stats[n].w + stats[n].l,
                rate: (stats[n].w + stats[n].l) ? Math.round((stats[n].w/(stats[n].w + stats[n].l))*100) : 0
            })).sort((a,b) => b.rate - a.rate || b.w - a.w);

            document.getElementById('stats-table-body').innerHTML = sorted.map((s, idx) => {
                let rankClass = '';
                let medal = '';
                if(s.m > 0) {
                    if(idx === 0) { rankClass = 'rank-1'; medal = '<span class="medal">🥇</span>'; }
                    else if(idx === 1) { rankClass = 'rank-2'; medal = '<span class="medal">🥈</span>'; }
                    else if(idx === 2) { rankClass = 'rank-3'; medal = '<span class="medal">🥉</span>'; }
                }
                return `<tr class="border-b border-slate-50 ${rankClass}">
                    <td class="py-3 px-2 font-bold flex items-center">${medal}${s.name}</td>
                    <td class="py-3 text-center text-green-600 font-bold">${s.w}</td>
                    <td class="py-3 text-center text-red-400 font-bold">${s.l}</td>
                    <td class="py-3 text-right font-black text-indigo-600">${s.rate}%</td>
                </tr>`;
            }).join('');

            // Render Fund
            document.getElementById('fund-list').innerHTML = Object.keys(stats).map(n => {
                const debt = Math.round(stats[n].sessionFee - stats[n].winMoney);
                return `<div class="card p-4 flex justify-between items-center">
                    <div><div class="font-bold text-sm">${n}</div><div class="text-[9px] text-slate-400 uppercase">Sân: ${Math.round(stats[n].sessionFee).toLocaleString()}đ | Thắng: ${Math.round(stats[n].winMoney).toLocaleString()}đ</div></div>
                    <div class="text-right"><div class="text-[9px] font-black text-slate-400 uppercase">Phải đóng</div><div class="text-lg font-black ${debt>0?'text-red-500':'text-green-500'}">${debt.toLocaleString()}đ</div></div>
                </div>`;
            }).join('');

            // Tab Mem
            document.getElementById('player-list-ui').innerHTML = players.map(p => `
                <div class="flex justify-between p-3 bg-slate-50 rounded-xl">
                    <span class="font-bold text-sm">${p.name}</span>
                    ${isAdmin ? `<button onclick="players=players.filter(x=>x.id!=${p.id});localStorage.setItem('pb_v8_players',JSON.stringify(players));render();" class="text-red-400 text-[10px] font-black">XÓA</button>` : ''}
                </div>
            `).join('');
        }

        showTab('tab-sessions');
    </script>
</body>
</html>
